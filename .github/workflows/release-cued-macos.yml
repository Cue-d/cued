name: Release Cued macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.1.0-internal.1). Leave empty to use package.json."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Update package versions
        if: ${{ inputs.version != '' }}
        run: |
          node -e '
            const fs = require("node:fs");
            const files = ["package.json"];
            for (const file of files) {
              const parsed = JSON.parse(fs.readFileSync(file, "utf8"));
              parsed.version = process.env.VERSION;
              fs.writeFileSync(file, `${JSON.stringify(parsed, null, 2)}\n`);
            }
          '
        env:
          VERSION: ${{ inputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "CUED_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CUED_RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Prepare bundled Google OAuth client
        run: |
          if [[ -z "${CUED_GOOGLE_OAUTH_CLIENT_JSON:-}" ]]; then
            echo "CUED_GOOGLE_OAUTH_CLIENT_JSON secret is required for stable Gmail OAuth releases" >&2
            exit 1
          fi
          GOOGLE_OAUTH_CLIENT_FILE="$RUNNER_TEMP/google-oauth-client.json"
          printf '%s' "$CUED_GOOGLE_OAUTH_CLIENT_JSON" > "$GOOGLE_OAUTH_CLIENT_FILE"
          node - "$GOOGLE_OAUTH_CLIENT_FILE" <<'NODE'
          const { readFileSync } = require("node:fs");
          const filePath = process.argv[2];
          const parsed = JSON.parse(readFileSync(filePath, "utf8"));
          const source = parsed.installed;
          if (!source?.client_id || !source?.client_secret) {
            throw new Error("Google OAuth client JSON must include installed client_id and client_secret");
          }
          NODE
          chmod 600 "$GOOGLE_OAUTH_CLIENT_FILE"
          echo "CUED_BUNDLED_GOOGLE_OAUTH_CLIENT_FILE=$GOOGLE_OAUTH_CLIENT_FILE" >> "$GITHUB_ENV"
        env:
          CUED_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.CUED_GOOGLE_OAUTH_CLIENT_JSON }}

      - name: Build, sign, and notarize app bundle + DMG
        run: bash scripts/sign-and-notarize-cued-app.sh
        env:
          CUED_CODESIGN_IDENTITY: ${{ secrets.CUED_CODESIGN_IDENTITY }}
          CUED_NOTARY_PROFILE: ${{ secrets.CUED_NOTARY_PROFILE }}
          CUED_RELEASE_CHANNEL: stable

      - name: Build release metadata
        run: node scripts/build-cued-release-metadata.mjs
        env:
          CUED_RELEASE_CHANNEL: stable
          CUED_RELEASE_REPO: Cue-d/cued

      - name: Create or update release
        run: |
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --title "Cued ${VERSION}"
          else
            gh release create "$TAG" --title "Cued ${VERSION}" --notes "Cued release ${VERSION}"
          fi
          gh release upload "$TAG" \
            native/macos/dist/Cued.dmg \
            native/macos/dist/cued-macos-arm64.tar.gz \
            native/macos/dist/release.json \
            native/macos/dist/SHA256SUMS \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
