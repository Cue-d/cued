name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: App Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: App quality
        run: pnpm check:app-quality

  slack-helper:
    name: Slack Helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/helpers/slack-go/go.mod
          cache-dependency-path: native/helpers/slack-go/go.sum

      - name: Test helper
        working-directory: native/helpers/slack-go
        run: go test -race ./...

  whatsapp-helper:
    name: WhatsApp Helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/helpers/whatsapp-go/go.mod
          cache-dependency-path: native/helpers/whatsapp-go/go.sum

      - name: Test helper
        working-directory: native/helpers/whatsapp-go
        run: go test -race ./...

  native-macos:
    name: Native macOS Build
    # GitHub-hosted macOS runners are currently billing-gated for this repo.
    if: ${{ vars.ENABLE_GITHUB_HOSTED_MACOS_CI == 'true' }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift build
        run: swift build --package-path native/macos/CuedNative -c release
